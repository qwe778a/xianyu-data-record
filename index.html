<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7plus · 戴森数据</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#1f2937;font:16px Arial,sans-serif}
main{max-width:760px;margin:auto;padding:20px 14px 60px}
h1{font-size:28px;color:#2563eb;margin:18px 0}
h2{font-size:22px;margin:0 0 15px}
h3{font-size:17px;margin:15px 0 8px}
button,input,select,textarea{font:inherit;border-radius:10px}
button{border:0;padding:12px;background:#e8edf5;color:#334155;cursor:pointer}
input,select,textarea{width:100%;min-width:0;border:1px solid #dbe2ea;padding:12px;background:white;color:#1f2937}
textarea{min-height:85px;resize:vertical}
label{display:block;font-weight:bold;margin:13px 0 6px}
nav,.row,.stats{display:grid;gap:9px}
.brands,.row{grid-template-columns:1fr 1fr}
.tabs{grid-template-columns:repeat(3,1fr);margin:16px 0}
.tabs button{font-size:14px;padding:11px 3px}
.active,.primary{background:#2563eb;color:white}
.box{padding:16px;background:white;border-radius:16px;margin:15px 0}
.card{border:1px solid #e2e8f0;padding:12px;border-radius:11px;margin-top:10px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meta{font-size:14px;color:#64748b;margin-top:7px;line-height:1.5;overflow-wrap:anywhere}
.stats{grid-template-columns:1fr 1fr;margin:14px 0}
.stat{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:10px}
.stat small{color:#64748b}
.stat strong{display:block;font-size:20px;margin-top:5px}
.wide{width:100%;margin-top:12px}
.danger{background:#fee2e2;color:#dc2626}
.edit{background:#eef4ff;color:#2563eb}
.good{color:#16a34a}
.bad{color:#dc2626}
.day{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e2e8f0;padding:16px 0 8px;font-weight:bold}
.sold{border-left:4px solid #f59e0b;background:#fffbeb}
.after{border-left:4px solid #ef4444;background:#fff7f7}
details{margin-top:8px;font-size:14px}
summary{color:#2563eb;cursor:pointer}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;padding:20px;color:#64748b}
.hidden{display:none!important}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;width:21px;height:21px;color:#64748b}
.search input{padding-left:42px}
#lock{position:fixed;inset:0;background:#f5f7fb;z-index:9999;display:grid;place-items:center;padding:20px}
#lock .box{width:100%;max-width:410px}
#pin,#again{letter-spacing:5px;text-align:center}
.notice{color:#9a3412;background:#fff7ed;padding:10px;border-radius:9px;font-size:14px}
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <h2 id="lockTitle">页面解锁</h2>
    <p class="meta">当前浏览器的页面锁，订单数据仍保存在本机。</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="六位数字密码">
    <input id="again" class="hidden" type="password" inputmode="numeric" maxlength="6" placeholder="再次输入密码" style="margin-top:10px">
    <button class="wide primary" onclick="unlockPin()">确认</button>
    <button id="faceButton" class="wide edit hidden" onclick="unlockFace()">Face ID / 指纹解锁</button>
    <p id="lockMessage" class="meta"></p>
  </div>
</div>

<main id="app" hidden>
  <nav class="brands">
    <button id="brand-seven" class="active" onclick="switchBrand('seven')">7plus</button>
    <button id="brand-dyson" onclick="switchBrand('dyson')">戴森</button>
  </nav>
  <h1 id="title">7plus数据</h1>
  <nav class="tabs" id="tabs"></nav>
  <div id="message" class="notice hidden"></div>
  <section id="content"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
'use strict';

const $=id=>document.getElementById(id);
const val=id=>$(id).value.trim();
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const clone=x=>JSON.parse(JSON.stringify(x));
const money=x=>'¥'+(Number(x)||0).toFixed(2);
const today=()=>{
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const md=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d))?Number(d.slice(5,7))+'月'+Number(d.slice(8))+'日':'未设置日期';
const profit=x=>(Math.round(Number(x.price||0)*100)-Math.round(Number(x.cost||0)*100))/100;
const names=['新增订单','订单明细','库存','售后','备份','数据导入'];
const versions=['Wi-Fi','无锁Wi-Fi','无锁纯原Wi-Fi','插卡','无锁插卡','无锁纯原插卡'];
const channels=['阿冰','小四','鸿福','拍机堂','无货源'];
const models=['HD08','HD15','HD16'];
const sheetNames={o:'订单明细',i:'库存',s:'已售出',a:'售后'};
const sevenKeys={o:'xianyuOrders',i:'xianyuInventory',s:'xianyuSoldInventory',a:'xianyuAfterSales'};
const sources={
  v3:{o:'dysonOrdersV3',i:'dysonInventoryV3',s:'dysonSoldV3',a:'dysonAfterSalesV3'},
  v2:{o:'dysonV2Orders',i:'dysonV2Inventory',s:'dysonV2Sold',a:'dysonV2AfterSales'},
  old:{o:'dysonOrders',i:'dysonInventory',s:'dysonSoldInventory',a:'dysonAfterSales'}
};
let brand='seven',page=0,editing=null,db={},blocked=false;
let search='',filterDate='all',pending=null;

function read(key){
  const raw=localStorage.getItem(key);
  if(raw===null)return [];
  const data=JSON.parse(raw);
  if(!Array.isArray(data)||data.some(x=>!x||typeof x!=='object'||Array.isArray(x)))
    throw Error(key+' 格式异常');
  return data;
}
function sourceCount(keys){
  try{return Object.values(keys).reduce((n,k)=>n+read(k).length,0)}
  catch{return -1}
}
function chooseSource(){
  const saved=localStorage.getItem('dysonActiveSource');
  if(sources[saved])return saved;
  return ['v3','v2','old'].find(s=>sourceCount(sources[s])>0)
    ||['v3','v2','old'].find(s=>Object.values(sources[s]).some(k=>localStorage.getItem(k)!==null))
    ||'v2';
}
let source=chooseSource();
function keys(){return brand==='seven'?sevenKeys:sources[source]}
function normalize(x){
  return {
    ...x,
    trackingNumber:String(x.trackingNumber??x.tracking??''),
    remark:String(x.remark??x.note??x.notes??''),
    editHistory:Array.isArray(x.editHistory)?x.editHistory:Array.isArray(x.history)?x.history:[],
    soldSeller:x.soldSeller??x.seller??'',
    soldOrderNumber:String(x.soldOrderNumber??x.soldNo??x.no??''),
    afterSalesDate:x.afterSalesDate??x.afterDate??'',
    afterSalesReason:x.afterSalesReason??x.afterReason??x.why??''
  };
}
function load(){
  blocked=false;
  db={o:[],i:[],s:[],a:[]};
  for(const t of Object.keys(db)){
    try{db[t]=read(keys()[t]).map(normalize)}
    catch(e){blocked=true;notice('读取失败：'+e.message+'。已暂停保存，请保留浏览器数据。')}
  }
}
function notice(text){
  $('message').textContent=text;
  $('message').classList.toggle('hidden',!text);
}
function commit(next){
  if(blocked){alert('数据读取异常，已暂停修改。');return false}
  const ks=keys(),previous={};
  try{
    for(const t in next)previous[t]=localStorage.getItem(ks[t]);
    for(const t in next)localStorage.setItem(ks[t],JSON.stringify(next[t]));
  }catch(e){
    try{
      for(const t in previous){
        if(previous[t]===null)localStorage.removeItem(ks[t]);
        else localStorage.setItem(ks[t],previous[t]);
      }
    }catch{blocked=true}
    alert('保存失败，当前表单保留。请检查浏览器存储空间。');
    return false;
  }
  Object.assign(db,next);
  return true;
}
function leaveEdit(){
  return !editing||confirm('离开编辑？尚未保存的修改将放弃，原记录保留。');
}
function switchBrand(b){
  if(!leaveEdit())return;
  brand=b;editing=null;page=0;pending=null;search='';filterDate='all';
  notice('');load();render();
}
function go(p){
  if(!leaveEdit())return;
  editing=null;page=p;pending=null;render();
}
function render(){
  $('title').textContent=(brand==='seven'?'7plus':'戴森')+'数据';
  ['seven','dyson'].forEach(b=>$('brand-'+b).classList.toggle('active',b===brand));
  $('tabs').innerHTML=names.map((n,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${n}</button>`).join('');
  const views=[formPage,orderPage,stockPage,afterPage,backupPage,importPage];
  $('content').innerHTML=views[page]();
  if(page===0||page===2)fillForm();
  if(page===1)renderOrders();
  window.scrollTo({top:0,behavior:'smooth'});
}
function select(id,label,items){
  return `<label for="${id}">${label}</label><select id="${id}"><option value="">请选择</option>${items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`;
}
function input(id,label,type='text'){
  return `<label for="${id}">${label}</label><input id="${id}" type="${type}" ${type==='number'?'min="0" step="0.01"':''}>`;
}
function area(id,label){
  return `<label for="${id}">${label}</label><textarea id="${id}"></textarea>`;
}
function productForm(){
  if(brand==='dyson')return select('model','型号',models);
  return select('version','网络和版本',versions)+
    `<div class="row" id="optionRow"><div>${select('capacity','储存容量',['32','128'])}</div><div id="fingerBox">${select('fingerprint','指纹功能',['无指纹','指纹'])}</div></div>`+
    select('channel','渠道',[...channels,'其他'])+
    `<div id="channelBox" class="hidden">${input('customChannel','其他渠道')}</div>`;
}
function formPage(stock=false){
  const edit=editing&&editing.type===(stock?'i':'o');
  return `<div class="box">
    <h2>${edit?'编辑':stock?'新增':'新增'}${stock?'库存':'订单'}</h2>
    ${stock?'':input('date','日期','date')}
    ${productForm()}
    ${stock&&brand==='dyson'?select('channel','渠道',[...channels,'其他'])+`<div id="channelBox" class="hidden">${input('customChannel','其他渠道')}</div>`:''}
    ${stock?'':input('trackingNumber','快递单号')+area('address','收货地址')}
    <div class="${stock?'':'row'}">
      <div>${input('cost','成本','number')}</div>
      ${stock?'':`<div>${input('price','售价','number')}</div>`}
    </div>
    ${stock?'':`<label>利润</label><input id="profit" readonly style="background:#eef4ff;color:#2563eb">`}
    ${area('remark','备注')}
    ${edit&&!stock?`
      ${select('editType','本次编辑类型',['换货','其他'])}
      <div id="editOther" class="hidden">${input('editReason','其他编辑说明')}</div>
      ${select('deleteType','删除原因',['退货','其他'])}
      <div id="deleteOther" class="hidden">${input('deleteReason','其他删除原因')}</div>
      <button class="wide danger" onclick="removeOrder()">删除订单并转到售后</button>
    `:''}
    <button class="wide primary" onclick="saveForm(${stock})">${edit?'保存编辑':stock?'添加库存':'保存订单'}</button>
    ${edit&&stock?`
      <h3>售出信息</h3><div class="row"><div>${input('seller','销售人')}</div><div>${input('soldNo','单号')}</div></div>
      <button class="wide edit" onclick="sellStock()">标记为已售出</button>
    `:''}
  </div>`;
}
function set(id,v){
  const el=$(id);if(!el)return;
  if(el.tagName==='SELECT'&&v!==undefined&&v!==null&&v!==''&&!Array.from(el.options).some(o=>o.value===String(v)))
    el.add(new Option(String(v),String(v)));
  el.value=v??'';
}
function fillForm(){
  const stock=page===2;
  const x=editing?db[editing.type][editing.index]:{};
  ['version','model','capacity','fingerprint','trackingNumber','address','cost','price','remark'].forEach(k=>set(k,x[k]));
  set('date',x.date||today());
  if($('channel')){
    const ch=x.channel==='阿宾'?'阿冰':x.channel||'';
    set('channel',channels.includes(ch)?ch:ch?'其他':'');
    set('customChannel',channels.includes(ch)?'':ch);
    $('channel').onchange=()=>toggle('channelBox',val('channel')==='其他');
    $('channel').onchange();
  }
  if($('version')){
    $('version').onchange=()=>{
      const pure=val('version').includes('纯原');
      toggle('fingerBox',!pure);
      $('optionRow').style.gridTemplateColumns=pure?'1fr':'1fr 1fr';
      if(pure)set('fingerprint','');
    };
    $('version').onchange();
  }
  if(!stock){
    $('cost').oninput=$('price').oninput=calc;
    calc();
  }
  if($('editType')){
    $('editType').onchange=()=>toggle('editOther',val('editType')==='其他');
    $('deleteType').onchange=()=>toggle('deleteOther',val('deleteType')==='其他');
  }
}
function toggle(id,show){$(id).classList.toggle('hidden',!show)}
function calc(){
  $('profit').value=val('cost')!==''&&val('price')!==''?profit({cost:val('cost'),price:val('price')}).toFixed(2):'';
}
function amount(id){
  const s=val(id),n=Number(s);
  if(!s||!Number.isFinite(n)||n<0)throw Error('请填写有效的'+(id==='cost'?'成本':'售价'));
  return Math.round(n*100)/100;
}
function formData(stock){
  const x={cost:amount('cost'),remark:val('remark')};
  if(brand==='dyson'){
    x.model=val('model');
    if(!models.includes(x.model))throw Error('请选择戴森型号');
  }else{
    x.version=val('version');x.capacity=val('capacity');
    x.fingerprint=x.version.includes('纯原')?'不适用':val('fingerprint');
    if(!x.version||!x.capacity||!x.fingerprint)throw Error('请填写型号、容量和指纹功能');
  }
  if($('channel')){
    x.channel=val('channel')==='其他'?val('customChannel'):val('channel');
    if(!x.channel)throw Error('请填写渠道');
  }
  if(!stock){
    x.date=val('date');x.price=amount('price');
    if(!x.date)throw Error('请选择日期');
    x.trackingNumber=val('trackingNumber');x.address=val('address');
    x.profit=profit(x).toFixed(2);
  }
  return x;
}
function saveForm(stock){
  try{
    const type=stock?'i':'o',old=editing?db[type][editing.index]:null;
    const x={...(old||{}),...formData(stock),id:old?.id??uid()};
    if(old&&!stock){
      const t=val('editType'),r=val('editReason');
      if(!t||t==='其他'&&!r)throw Error('请选择编辑类型；其他需要填写说明');
      x.editHistory=[...(old.editHistory||[]),{date:today(),type:t,reason:t==='其他'?r:t}];
    }
    const list=db[type].slice();
    if(old)list[editing.index]=x;else list.unshift(x);
    if(!commit({[type]:list}))return;
    editing=null;
    page=stock?2:1;search='';filterDate='all';render();
  }catch(e){alert(e.message)}
}
function editRecord(type,index){
  if(!leaveEdit())return;
  editing={type,index};page=type==='i'?2:0;render();
}
function removeOrder(){
  const t=val('deleteType'),r=t==='其他'?val('deleteReason'):t;
  if(!r){alert('请选择删除原因，其他需要手动填写');return}
  if(!confirm('将此订单移到售后？原订单资料会保留在售后。'))return;
  const x=db.o[editing.index];
  const a=[{...x,afterSalesId:uid(),afterSalesDate:today(),afterSalesReason:r},...db.a];
  if(!commit({a,o:db.o.filter((_,i)=>i!==editing.index)}))return;
  editing=null;page=3;render();
}
function sellStock(){
  try{
    const seller=val('seller'),no=val('soldNo');
    if(!seller||!no)throw Error('请填写销售人和单号');
    const x={...db.i[editing.index],...formData(true),soldSeller:seller,soldOrderNumber:no,soldDate:today()};
    if(!confirm('标记为已售出？当前库存修改也会保存。'))return;
    if(!commit({s:[x,...db.s],i:db.i.filter((_,i)=>i!==editing.index)}))return;
    editing=null;render();
  }catch(e){alert(e.message)}
}
function permanentlyRemove(type,index){
  if(!confirm('永久删除这条'+(type==='a'?'售后':'已售出')+'记录？'))return;
  if(commit({[type]:db[type].filter((_,i)=>i!==index)}))render();
}
function product(x){
  return brand==='dyson'?(x.model||x.version||'未识别型号'):
    [x.version,x.capacity,String(x.version).includes('纯原')||x.fingerprint==='不适用'?'':x.fingerprint].filter(Boolean).join(' ');
}
function detail(x){
  return `<div class="meta">成本 ${money(x.cost)}${x.price!==undefined?' · 售价 '+money(x.price):''}</div>
    ${x.channel?`<div class="meta">渠道：${esc(x.channel)}</div>`:''}
    ${x.remark?`<div class="meta pre">备注：${esc(x.remark)}</div>`:''}`;
}
function address(x){
  return `<details><summary>查看收货地址</summary><div class="meta pre">${esc(x.address||'未填写')}</div></details>`;
}
function orderCard(x,index){
  const h=x.editHistory?.[x.editHistory.length-1],p=profit(x);
  return `<div class="card"><div class="top"><b>${esc(product(x))}</b><b class="${p>=0?'good':'bad'}">${money(p)}</b></div>
    <div class="meta">${esc(md(x.date))} · 单号：${esc(x.trackingNumber||'未填写')}</div>
    ${detail(x)}${address(x)}
    ${h?`<div class="meta">最近编辑：${esc(h.type==='自定义'?'其他':h.type)} · ${esc(h.reason)}</div>`:''}
    <button class="wide edit" onclick="editRecord('o',${index})">编辑订单</button></div>`;
}
function stats(items,stock=false){
  const total=k=>items.reduce((n,x)=>n+Number(x[k]||0),0);
  const pairs=stock?[['库存数量',items.length],['库存总成本',money(total('cost'))]]:
    [['订单数量',items.length],['总成本',money(total('cost'))],['总售价',money(total('price'))],['总利润',money(items.reduce((n,x)=>n+profit(x),0))]];
  return `<div class="stats">${pairs.map(([l,v])=>`<div class="stat"><small>${l}</small><strong>${v}</strong></div>`).join('')}</div>`;
}
function orderPage(){
  const dates=[...new Set(db.o.map(x=>x.date).filter(Boolean))].sort().reverse();
  if(!dates.includes(filterDate))filterDate='all';
  return `<div class="box"><h2>订单明细</h2>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg>
    <input id="search" type="search" value="${esc(search)}" placeholder="搜索型号、单号、地址、渠道、备注" oninput="search=this.value;renderOrders()"></div>
    <label>日期筛选</label><select id="filter" onchange="filterDate=this.value;renderOrders()">
    <option value="all">全部日期</option>${dates.map(d=>`<option value="${esc(d)}" ${d===filterDate?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <div id="totals"></div><div id="orders"></div></div>`;
}
function renderOrders(){
  const words=search.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const entries=db.o.map((x,index)=>({x,index})).filter(({x})=>{
    const text=[x.id,product(x),x.date,md(x.date),x.channel,x.trackingNumber,x.address,x.remark,x.originalProduct,x.cost,x.price,profit(x),...(x.editHistory||[]).map(h=>h.reason)].join(' ').toLowerCase();
    return (filterDate==='all'||x.date===filterDate)&&words.every(w=>text.includes(w));
  });
  $('totals').innerHTML=stats(entries.map(e=>e.x));
  const groups=new Map();
  for(const e of entries){
    const d=e.x.date||'';
    if(!groups.has(d))groups.set(d,[]);
    groups.get(d).push(e);
  }
  $('orders').innerHTML=entries.length?[...groups.keys()].sort().reverse().map(d=>{
    const list=groups.get(d),p=list.reduce((n,e)=>n+profit(e.x),0);
    return `<div class="day"><span>${esc(md(d))} · ${list.length}单</span><span class="${p>=0?'good':'bad'}">利润 ${money(p)}</span></div>`+
      list.map(e=>orderCard(e.x,e.index)).join('');
  }).join(''):'<div class="empty">没有符合条件的订单。</div>';
}
function stockPage(){
  return formPage(true)+`<div class="box"><h2>库存明细</h2>${stats(db.i,true)}
    ${db.i.map((x,i)=>`<div class="card"><div class="top"><b>${esc(product(x))}</b><b>${money(x.cost)}</b></div>${detail(x)}
    <button class="wide edit" onclick="editRecord('i',${i})">编辑库存 / 标记售出</button></div>`).join('')||'<div class="empty">暂无库存</div>'}</div>
    <div class="box"><h2>已售出记录</h2>
    ${db.s.map((x,i)=>`<div class="card sold"><b>${esc(product(x))}</b>
    <div class="meta">${esc(md(x.soldDate))} · 销售人：${esc(x.soldSeller||'未填写')}</div>
    <div class="meta">单号：${esc(x.soldOrderNumber||'未填写')}</div>${detail(x)}

  setTimeout(()=>URL.revokeObjectURL(url),30000);
}

async function workbook(file){

async function restoreBackup(){

    const b=await workbook($('restoreFile').files[0]);
    const meta=b.Sheets['说明']&&XLSX.utils.sheet_to_json(b.Sheets['说明'])[0];

      throw Error('请选择当前分类在本版本导出的备份。旧订单表请使用“数据导入”。');

        if(!x||Array.isArray(x)||typeof x!=='object')throw Error('备份记录格式错误');

function importPage(){

function template(){
  try{
    needXLSX();
    const headers=brand==='seven'?['日期','网络和版本','容量','指纹','渠道','快递单号','收货地址','成本','售价','备注']:
      ['日期','型号','快递单号','收货地址','成本','售价','备注'];
    const b=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(b,XLSX.utils.aoa_to_sheet([headers]),'订单明细');
    XLSX.writeFile(b,(brand==='seven'?'7plus':'戴森')+'导入模板.xlsx');
  }catch(e){alert(e.message)}

function parseDate(v,fallback){
  if(v===''||v===undefined||v===null)return fallback;
  if(typeof v==='number'){
    const d=XLSX.SSF.parse_date_code(v);
    if(!d)throw Error('日期无法识别');
    v=d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  const m=String(v).trim().match(/^(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?$/);
  if(!m)throw Error('日期请使用 YYYY-MM-DD');
  const y=+m[1],mo=+m[2],d=+m[3],test=new Date(y,mo-1,d);
  if(test.getFullYear()!==y||test.getMonth()!==mo-1||test.getDate()!==d)throw Error('无效日期');
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function importNumber(v,label){
  if(v===undefined||v===null||String(v).trim()===''||!Number.isFinite(Number(v))||Number(v)<0)
    throw Error(label+'缺失或无效');
  return Math.round(Number(v)*100)/100;
}
function rawModel(raw){
  const text=String(raw),lock=text.includes('无锁'),pure=text.includes('纯原'),card=text.includes('插卡');
  let version=card?'插卡':/wi[\s-]?fi/i.test(text)?'Wi-Fi':'未识别';
  if(lock)version=pure?(card?'无锁纯原插卡':'无锁纯原Wi-Fi'):(card?'无锁插卡':'无锁Wi-Fi');
  return {version,capacity:['256','128','64','32'].find(c=>text.includes(c))||'',
    fingerprint:pure?'不适用':text.includes('无指纹')?'无指纹':text.includes('指纹')?'指纹':'',originalProduct:text};
}
async function previewImport(){
  pending=null;
  try{
    const b=await workbook($('importFile').files[0]);
    const meta=b.Sheets['说明']&&XLSX.utils.sheet_to_json(b.Sheets['说明'])[0];
    if(meta&&meta.分类!==brand)throw Error('文件属于另一个分类');
    const ws=b.Sheets['订单明细']||b.Sheets[b.SheetNames[0]];
    const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!matrix.length)throw Error('表格为空');
    const header=matrix[0].some(h=>['完整记录','网络和版本','型号','戴森型号','成本'].includes(String(h)));
    if(!header&&brand==='dyson')throw Error('戴森表格需要表头');
    const rows=header?XLSX.utils.sheet_to_json(ws,{defval:''}):matrix;
    const result=[],errors=[];
    const fallback=val('importDate')||today();
    rows.forEach((r,i)=>{
      try{
        let x;
        if(header&&r.完整记录){
          x=normalize(JSON.parse(r.完整记录));
          if(brand==='dyson'&&!models.includes(String(x.model).toUpperCase()))throw Error('不是戴森型号');
          if(brand==='seven'&&models.includes(String(x.model).toUpperCase()))throw Error('不是7plus订单');
        }else if(header){
          x={id:r.编号||uid(),date:r.日期,version:r['网络和版本'],capacity:String(r.容量??''),
            fingerprint:r.指纹||r.指纹功能||'',model:String(r.型号||r.戴森型号||'').trim().toUpperCase(),
            channel:r.渠道||'无货源',trackingNumber:String(r.快递单号??''),address:r.收货地址||'',
            cost:r.成本,price:r.售价,remark:r.备注||'',editHistory:[]};
          if(brand==='dyson'&&!models.includes(x.model))throw Error('型号只能是HD08、HD15、HD16');
          if(brand==='seven'&&!x.version)throw Error('缺少网络和版本');
        }else{
          if(!r.some(v=>String(v).trim()))return;
          x={...rawModel(r[0]),id:uid(),channel:'无货源',trackingNumber:String(r[1]??''),cost:r[2],price:r[3],address:r[5]||'',editHistory:[]};
        }
        x.date=parseDate(x.date,fallback);
        x.cost=importNumber(x.cost,'成本');x.price=importNumber(x.price,'售价');
        x.profit=profit(x).toFixed(2);
        result.push(normalize(x));
      }catch(e){errors.push('第'+(i+(header?2:1))+'行：'+e.message)}
    });
    if(errors.length)throw Error(errors.slice(0,6).join('\n')+'\n请修正后重新选择文件，本次未导入。');
    pending=result;
    $('importInfo').textContent='检查通过：'+result.length+'条。点击确认后追加，编号或快递单号重复的订单会跳过。';
  }catch(e){$('importInfo').textContent=e.message}
}
function applyImport(){
  if(!pending?.length){alert('请先选择并检查文件');return}
  const ids=new Set(db.o.map(x=>String(x.id)));
  const tracks=new Set(db.o.map(x=>x.trackingNumber).filter(Boolean));
  const added=[];
  for(const x of pending){
    if(ids.has(String(x.id))||x.trackingNumber&&tracks.has(x.trackingNumber))continue;
    added.push(x);ids.add(String(x.id));
    if(x.trackingNumber)tracks.add(x.trackingNumber);
  }
  if(!confirm('新增 '+added.length+' 条，跳过重复 '+(pending.length-added.length)+' 条？'))return;
  if(!commit({o:[...added,...db.o]}))return;
  pending=null;page=1;search='';filterDate='all';render();
}

/* 沿用原六位密码和已绑定的设备凭证 */
const securityKey='xianyuSecurityV1';
let security={};
try{security=JSON.parse(localStorage.getItem(securityKey)||'{}')||{}}
catch{$('lockMessage').textContent='密码设置读取失败，请勿清除网站数据。'}
async function hash(text){
  return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text))))
    .map(x=>x.toString(16).padStart(2,'0')).join('');
}
function opened(){
  $('lock').classList.add('hidden');
  $('app').hidden=false;
  load();render();
}
async function unlockPin(){
  try{
    const pin=val('pin');
    if(!/^\d{6}$/.test(pin))throw Error('请输入六位数字');
    if(!security.pinHash){
      if(pin!==val('again'))throw Error('两次密码不一致');
      security.pinHash=await hash(pin);
      localStorage.setItem(securityKey,JSON.stringify(security));
    }else if(await hash(pin)!==security.pinHash)throw Error('密码不正确');
    opened();
  }catch(e){$('lockMessage').textContent=e.message}
}
const bytes=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlockFace(){
  try{
    if(!security.credentialId)throw Error('尚未绑定');
    const c=await navigator.credentials.get({publicKey:{
      challenge:bytes(32),allowCredentials:[{type:'public-key',id:un64(security.credentialId)}],
      userVerification:'required',timeout:60000
    }});
    if(!c||b64(c.rawId)!==security.credentialId)throw Error('设备不匹配');
    opened();
  }catch{$('lockMessage').textContent='设备验证未完成，请使用六位密码。'}
}
async function bindFace(){
  try{
    if(!window.PublicKeyCredential||!navigator.credentials)throw Error('请使用支持通行密钥的浏览器');
    const c=await navigator.credentials.create({publicKey:{
      challenge:bytes(32),rp:{name:'7plus与戴森数据'},
      user:{id:bytes(16),name:'local-user',displayName:'本机用户'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,attestation:'none'
    }});
    security.credentialId=b64(c.rawId);
    localStorage.setItem(securityKey,JSON.stringify(security));
    alert('绑定成功');
  }catch(e){alert('绑定未完成：'+e.message)}
}
async function changePin(){
  try{
    const old=prompt('当前六位密码');
    if(old===null)return;
    if(await hash(old)!==security.pinHash)throw Error('当前密码错误');
    const n=prompt('新的六位数字密码');
    if(n===null)return;
    if(!/^\d{6}$/.test(n))throw Error('必须是六位数字');
    if(prompt('再次输入新密码')!==n)throw Error('两次密码不一致');
    security.pinHash=await hash(n);
    localStorage.setItem(securityKey,JSON.stringify(security));
    alert('修改成功');
  }catch(e){alert(e.message)}
}
$('lockTitle').textContent=security.pinHash?'页面解锁':'设置六位密码';
$('again').classList.toggle('hidden',!!security.pinHash);
$('faceButton').classList.toggle('hidden',!security.credentialId);
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlockPin()});
</script>
<!-- 7plus 分成 60% 功能 -->
<script>
(function(){
  /* 重新计算利润：分成订单只计算你的 60% */
  profit=function(order){
    const original=Number(order.price||0)-Number(order.cost||0);
    const rate=Number(order.shareRate)||1;
    return Math.round(original*rate*100)/100;
  };

  /* 在 7plus 新增订单增加“分成”选项 */
  const oldFormPage=formPage;
  formPage=function(stock=false){
    let html=oldFormPage(stock);

    if(!stock&&brand==='seven'){
      const oldHtml=
        '<label for="remark">备注</label><textarea id="remark"></textarea>';

      const newHtml=oldHtml+
        '<label for="shareRate">分成</label>'+
        '<select id="shareRate">'+
          '<option value="1">不分成</option>'+
          '<option value="0.6">分成 60%</option>'+
        '</select>';

      html=html.replace(oldHtml,newHtml);
    }

    return html;
  };

  /* 编辑订单时显示原来的分成选择 */
  const oldFillForm=fillForm;
  fillForm=function(){
    oldFillForm();

    const share=$('shareRate');

    if(share){
      const order=editing?db[editing.type][editing.index]:{};
      share.value=Number(order.shareRate)===0.6?'0.6':'1';
      share.onchange=calc;
      calc();
    }
  };

  /* 保存订单时保存分成比例 */
  const oldFormData=formData;
  formData=function(stock){
    const data=oldFormData(stock);

    if(!stock&&brand==='seven'){
      data.shareRate=val('shareRate')==='0.6'?0.6:1;
      data.profit=profit(data).toFixed(2);
    }

    return data;
  };

  /* 新增订单页面实时显示分成后的利润 */
  calc=function(){
    const cost=Number(val('cost'));
    const price=Number(val('price'));
    const rate=val('shareRate')==='0.6'?0.6:1;

    $('profit').value=
      val('cost')!==''&&val('price')!==''?
      (Math.round((price-cost)*rate*100)/100).toFixed(2):'';
  };

  /* 订单明细显示分成说明 */
  const oldDetail=detail;
  detail=function(order){
    let html=oldDetail(order);

    if(brand==='seven'&&Number(order.shareRate)===0.6){
      html+='<div class="meta good">分成：你拿 60%</div>';
    }

    return html;
  };
})();
</script>
