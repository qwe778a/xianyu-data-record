<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闲鱼数据记录</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}
    main{max-width:700px;margin:auto;padding:24px 16px}
    h1{margin:0 0 8px;color:#2563eb}
    p{color:#64748b}
    .box{background:#fff;border-radius:16px;padding:18px;margin-top:18px}
    input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #dbe2ea;border-radius:9px;font-size:16px}
    button{width:100%;padding:13px;border:0;border-radius:9px;background:#2563eb;color:white;font-size:16px}
  </style>
</head>
<body>
  <main>
    <h1>闲鱼数据记录</h1>
    <p>订单、库存、收款和售后，后面我们会慢慢加进去。</p>

    <div class="box">
      <h2>新增订单</h2>
      <input placeholder="商品型号">
      <input placeholder="订单号">
      <input placeholder="成本">
      <input placeholder="售价">
      <button>保存订单</button>
    </div>

    <div class="box">
      <h2>我的数据</h2>
      <p>暂时还没有订单记录。</p>
    </div>
  </main>
</body>
</html>
